name: Dad jokes generator

on:
  issues:
    types: [closed]
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
    # step 1 fecth repository file
      - name: Checkout repository
        uses: actions/checkout@v4

    # step 2: fetch a joke from a free internet api and overwrite readme.md
      - name: fetch and save dad joke from internet
        run: |
          echo "# 🤖 Dad Joke Playground" > README.md
          echo "Here is a fresh dad joke automatically generated by GitHub Actions:" >> README.md
          echo "" >> README.md
          echo "> $(curl -s -H "Accept: text/plain" https://icanhazdadjoke.com)" >> README.md

    # step3: commit and push the updated readme.md back to the repository
      - name: commit and publish change
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add README.md
          git commit -m "chore: update dad joke in readme file" || echo "no changes to commit"
          git push
      
    
